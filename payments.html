<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments | Receipt Pilot</title>
  <meta name="description" content="Record customer payments and refunds in Receipt Pilot.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .bm-form { display: grid; gap: 12px; margin: 16px 0 24px; }
    .bm-grid { display: grid; gap: 12px; }
    @media (min-width: 760px) { .bm-grid { grid-template-columns: 1fr 1fr; } }
    .bm-note { color: #57534e; }
    .bm-error { color: #b91c1c; min-height: 1.2em; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">Receipt-<span>Pilot</span></a>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="siteNav">Menu</button>
      <nav class="nav" id="siteNav">
        <a href="index.html">Receipt Generator</a>
        <a href="accounting.html">Accounting</a>
        <a href="payments.html" class="active">Payments</a>
        <a href="expenses.html">Expenses</a>
        <a href="inventory.html">Inventory</a>
        <a href="suppliers.html">Suppliers</a>
        <button type="button" class="btn btn-ghost btn-sm" data-open-login>Account</button>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="wrap">
      <h1>Payments and refunds</h1>
      <p class="bm-note" id="paymentStatus">Sign in to record payments against your receipts.</p>
      <form class="bm-form" id="paymentForm">
        <div class="bm-grid">
          <div class="field"><label for="paymentReceipt">Receipt</label><select id="paymentReceipt" required></select></div>
          <div class="field"><label for="paymentAmount">Amount</label><input type="number" id="paymentAmount" min="0.01" step="0.01" required></div>
          <div class="field"><label for="paymentMethod">Method</label><select id="paymentMethod"><option>Cash</option><option>Transfer</option><option>Card</option><option>Other</option></select></div>
          <div class="field"><label for="paymentDate">Payment date</label><input type="date" id="paymentDate" required></div>
          <div class="field"><label for="paymentReference">Reference</label><input id="paymentReference" maxlength="80"></div>
          <div class="field"><label for="paymentNotes">Notes</label><input id="paymentNotes" maxlength="160"></div>
        </div>
        <p class="bm-error" id="paymentError" role="alert"></p>
        <button class="btn btn-primary" type="submit">Save payment</button>
      </form>
      <h2>Record a refund</h2>
      <form class="bm-form" id="refundForm">
        <div class="bm-grid">
          <div class="field"><label for="refundReceipt">Receipt</label><select id="refundReceipt"></select></div>
          <div class="field"><label for="refundAmount">Amount</label><input type="number" id="refundAmount" min="0.01" step="0.01" required></div>
          <div class="field"><label for="refundStatus">Status</label><select id="refundStatus"><option value="completed">Completed</option><option value="pending">Pending</option><option value="failed">Failed</option><option value="cancelled">Cancelled</option></select></div>
          <div class="field"><label for="refundDate">Refund date</label><input type="date" id="refundDate" required></div>
          <div class="field"><label for="refundReason">Reason</label><input id="refundReason" maxlength="160"></div>
        </div>
        <p class="bm-error" id="refundError" role="alert"></p>
        <button class="btn btn-secondary" type="submit">Save refund</button>
      </form>
      <p class="bm-note">Payments update the receipt balance. Refunds are recorded separately and do not change that balance or restore stock.</p>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/account.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>
