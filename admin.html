<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Deletion Requests | Receipt Pilot</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <meta name="theme-color" content="#0f766e">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">Receipt Pilot</a>
    </div>
  </header>
  <main class="wrap page">
    <h1>Account Deletion Requests</h1>
    <p class="hint">Pending requests only. Access is restricted to authorized Receipt Pilot owners.</p>
    <p id="adminStatus" class="hint">Checking access…</p>
    <div id="adminTableWrap" class="table-scroll" hidden>
      <table class="data">
        <thead>
          <tr>
            <th>User</th>
            <th>Business</th>
            <th>Requested</th>
            <th>Purge Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="adminBody"></tbody>
      </table>
    </div>
  </main>
  <script src="js/config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" defer></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
