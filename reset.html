<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Receipt-Pilot</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">Receipt-<span>Pilot</span></a>
    </div>
  </header>
  <main class="page">
    <div class="wrap page-card">
      <h1>Choose a new password</h1>
      <p id="resetStatus">Checking your reset link.</p>
      <form id="resetForm" hidden>
        <div class="field"><label for="newPass">New password</label><input id="newPass" type="password" minlength="6" required></div>
        <div class="field"><label for="newPass2">Confirm password</label><input id="newPass2" type="password" required></div>
        <p class="error" id="resetError"></p>
        <button class="btn btn-primary" type="submit">Save password</button>
      </form>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    document.getElementById("resetForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = document.getElementById("resetError");
      var status = document.getElementById("resetStatus");
      err.textContent = "";
      var a = document.getElementById("newPass").value;
      var b = document.getElementById("newPass2").value;
      if (a !== b) { err.textContent = "Passwords do not match."; return; }
      if (a.length < 6) { err.textContent = "Use a password of at least 6 characters."; return; }
      var sb = ReceiptlyCloud.ready ? await ReceiptlyCloud.ready() : ReceiptlyCloud.client();
      if (!sb) {
        err.textContent = "Unable to load the account service. Check your internet connection and try again.";
        return;
      }
      try {
        var result = await sb.auth.updateUser({ password: a });
        if (result.error) throw result.error;
        try { await sb.auth.signOut(); } catch (ex) { /* return to login */ }
        document.getElementById("resetForm").hidden = true;
        status.textContent = "Password updated. You can now log in with the new password.";
        setTimeout(function () { location.href = "index.html"; }, 1200);
      } catch (ex) {
        err.textContent = friendlyAuthError(ex);
      }
    });

    function friendlyAuthError(ex) {
      var m = String((ex && (ex.message || ex.error_description)) || ex || "");
      if (/expired|otp_expired/i.test(m)) return "This reset link has expired. Request a new one and try again.";
      if (/session|invalid|jwt/i.test(m)) return "This reset link is invalid or has already been used.";
      return ReceiptlyCloud.friendlyError ? ReceiptlyCloud.friendlyError(ex) : "Could not update the password. Request a new reset link.";
    }

    function linkError() {
      var hash = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
      var query = new URLSearchParams(location.search || "");
      var code = hash.get("error_code") || query.get("error_code") || "";
      var desc = hash.get("error_description") || query.get("error_description") || "";
      if (/otp_expired|expired/i.test(code + " " + desc)) return "This reset link has expired. Request a new one from the login screen.";
      if (hash.get("error") || query.get("error")) return "This reset link is invalid or has already been used.";
      return "";
    }

    (async function prepareReset() {
      var status = document.getElementById("resetStatus");
      var form = document.getElementById("resetForm");
      var bad = linkError();
      if (bad) {
        status.textContent = bad;
        return;
      }
      var sb = ReceiptlyCloud.ready ? await ReceiptlyCloud.ready() : ReceiptlyCloud.client();
      if (!sb) {
        status.textContent = "Unable to load the account service. Check your internet connection and try again.";
        return;
      }
      var ready = false;
      sb.auth.onAuthStateChange(function (event, session) {
        if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") && session) ready = true;
      });
      var session = await sb.auth.getSession();
      if (session.data && session.data.session) ready = true;
      if (!ready) {
        await new Promise(function (resolve) { setTimeout(resolve, 800); });
        session = await sb.auth.getSession();
        if (session.data && session.data.session) ready = true;
      }
      if (!ready) {
        status.textContent = "This reset link is invalid, expired, or has already been used. Request a new one from the login screen.";
        return;
      }
      status.textContent = "Enter a new password for your Receipt Pilot account.";
      form.hidden = false;
    })();
  </script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
