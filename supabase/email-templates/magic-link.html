<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Receipt Pilot sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#f4f7f7;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7f7;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;padding:32px 28px;">
          <tr>
            <td>
              <p style="margin:0 0 8px;font-size:22px;font-weight:800;color:#0F766E;">Receipt Pilot</p>
              <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;">Your sign-in code</h1>
              <p style="margin:0 0 20px;font-size:16px;line-height:1.5;">Enter this code on the Receipt Pilot sign-in screen. It expires soon and can only be used once.</p>
              <p style="margin:0 0 20px;font-size:32px;letter-spacing:6px;font-weight:800;color:#0F766E;">{{ .Token }}</p>
              <p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#64748b;">If you prefer, you can still use the sign-in link:</p>
              <p style="margin:0 0 20px;font-size:13px;line-height:1.5;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#0F766E;">{{ .ConfirmationURL }}</a></p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#64748b;">If you did not request this code, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
