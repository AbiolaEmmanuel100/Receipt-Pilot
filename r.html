<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Pilot Receipt Verification</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="logo" href="index.html">Receipt<span>ly</span></a>
    </div>
  </header>
  <main class="wrap" style="padding:24px 16px 48px;max-width:720px">
    <h1 style="font-size:1.2rem;margin:0 0 12px">Receipt Pilot Receipt Verification</h1>
    <p id="shareLoad" class="hint">Loading receipt…</p>
    <p id="shareMissing" class="empty-state" hidden>
      This receipt link is invalid or no longer available.
    </p>
    <div id="shareView" hidden>
      <p class="notice" id="verifyBanner"></p>
      <div class="preview-actions" style="margin-bottom:12px">
        <button type="button" class="btn btn-primary" id="pubPdf">Download PDF</button>
        <button type="button" class="btn btn-secondary" id="pubImage">Download image</button>
        <button type="button" class="btn btn-secondary" id="pubPrint">Print</button>
      </div>
      <div class="card receipt-card"><div id="shareReceiptEl" class="receipt"></div></div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/share.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async function () {
      var params = new URLSearchParams(location.search);
      var token = (params.get("t") || "").trim();
      var load = document.getElementById("shareLoad");
      var missing = document.getElementById("shareMissing");
      var view = document.getElementById("shareView");
      var rec = null;
      function showMissing() {
        load.hidden = true;
        missing.hidden = false;
      }
      if (token.length < 8) { showMissing(); return; }
      try {
        if (window.ReceiptlyCloud && ReceiptlyCloud.ready) {
          var c = await ReceiptlyCloud.ready();
          if (c) {
            var res = await c.rpc("get_shared_receipt", { share: token });
            if (res.data && typeof res.data === "object") rec = res.data;
          }
        }
      } catch (e) { /* try local */ }
      if (!rec && window.ReceiptlyStorage) {
        try {
          var rows = await ReceiptlyStorage.getVisibleReceipts();
          rec = rows.find(function (r) { return r.shareToken === token; }) || null;
        } catch (e2) { /* ignore */ }
      }
      if (!rec) { showMissing(); return; }
      load.hidden = true;
      view.hidden = false;
      var banner = document.getElementById("verifyBanner");
      if (banner) {
        banner.textContent = "Receipt Verified ✓  ·  " + (rec.number || "") + "  ·  " +
          ((rec.business && rec.business.name) || "") + "  ·  " + (rec.date || "") + "  ·  " +
          ReceiptlyCalc.money(rec.grand, rec.currency || "NGN");
      }
      ReceiptlyReceipt.render(rec, document.getElementById("shareReceiptEl"));
      document.getElementById("pubPrint").addEventListener("click", function () { window.print(); });
      document.getElementById("pubImage").addEventListener("click", async function () {
        try {
          if (window.ReceiptlyShare && ReceiptlyShare.downloadImage) await ReceiptlyShare.downloadImage(rec);
        } catch (e) {
          if (window.ReceiptlyUI) ReceiptlyUI.toast("Unable to download the image right now.", "error");
        }
      });
      document.getElementById("pubPdf").addEventListener("click", async function () {
        try {
          await ReceiptlyPdf.download(document.getElementById("shareReceiptEl"), rec.number || "receipt");
        } catch (e) {
          if (window.ReceiptlyUI) ReceiptlyUI.toast("Unable to download PDF right now. Use Print instead.", "error");
        }
      });
    })();
  </script>
</body>
</html>
